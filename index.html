<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Yummy Math — a fun food-themed Grade 1 math game with counting, addition, subtraction, shapes and more.">
<meta name="theme-color" content="#f97316">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='78' font-size='82'>%F0%9F%8D%8E</text></svg>">

<title>Yummy Math 🍎 Grade 1 Food Math</title>

<style>

:root {

  --cream:        #fffaf2;
  --dough:        #fff1dc;
  --crust:        #f6c88b;
  --tomato:       #ef4444;
  --tomato-dark:  #b91c1c;
  --carrot:       #f97316;
  --carrot-dark:  #c2410c;
  --pumpkin:      #f59e0b;
  --honey:        #fbbf24;
  --honey-soft:   #fde68a;
  --berry:        #e11d48;
  --berry-soft:   #ffe4ec;
  --mint:         #22c55e;
  --mint-dark:    #15803d;
  --mint-soft:    #dcfce7;
  --basil:        #166534;
  --cocoa:        #7c4a2d;
  --choco:        #43251a;
  --ink:          #3d2a1d;
  --muted:        #8b7361;
  --paper:        #ffffff;
  --line:         #ffe3bd;

  --shadow-sm:    0 3px 0 rgba(146, 64, 14, 0.12);
  --shadow-md:    0 8px 20px rgba(146, 64, 14, 0.14);
  --shadow-lg:    0 18px 40px rgba(146, 64, 14, 0.18);
  --shadow-inner: inset 0 -4px 0 rgba(0, 0, 0, 0.06);

  --radius-sm:    12px;
  --radius-md:    18px;
  --radius-lg:    26px;
  --radius-xl:    34px;
  --radius-pill:  999px;

  --fast:         0.15s;
  --normal:       0.28s;
  --slow:         0.55s;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  margin: 0;
  padding: 0;
  min-height: 100vh;
  font-family: Verdana, Geneva, Tahoma, Arial, sans-serif;
  font-size: 16px;
  line-height: 1.55;
  color: var(--ink);
  background-color: var(--cream);

  background:
    radial-gradient(circle at 8% 12%,  #ffd9c7 0 7%, transparent 8%),
    radial-gradient(circle at 92% 8%,  #fff0b8 0 8%, transparent 9%),
    radial-gradient(circle at 4% 78%,  #ffe0ea 0 7%, transparent 8%),
    radial-gradient(circle at 96% 72%, #dcffd9 0 8%, transparent 9%),
    radial-gradient(circle at 50% 50%, #fffdf8 0 40%, transparent 70%),
    linear-gradient(150deg, #fff8ee 0%, #ffeef3 45%, #f2fff4 100%);
  background-attachment: fixed;
  overflow-x: hidden;
}

img,
svg {
  max-width: 100%;
  display: block;
}

button {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
}

h1, h2, h3, h4 {
  margin: 0;
  line-height: 1.2;
  color: var(--carrot-dark);
}

p {
  margin: 0;
}

a {
  color: var(--carrot-dark);
}

:focus-visible {
  outline: 4px solid var(--honey);
  outline-offset: 3px;
  border-radius: 8px;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

.hidden {
  display: none !important;
}

.fx-layer {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 0;
}

.float-food {
  position: absolute;
  font-size: 30px;
  opacity: 0.35;
  filter: blur(0.2px);
  animation-name: drift;
  animation-timing-function: linear;
  animation-iteration-count: infinite;
}

.float-food.spin {
  animation-name: drift, slowSpin;
  animation-timing-function: linear, linear;
  animation-iteration-count: infinite, infinite;
}

.page {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.wrap {
  width: 100%;
  max-width: 1120px;
  margin: 0 auto;
  padding: 0 18px;
}

main#screen {
  flex: 1;
  width: 100%;
  max-width: 1120px;
  margin: 0 auto;
  padding: 30px 18px 70px;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  background: linear-gradient(115deg, #fb923c, #f97316, #fb7185, #f97316);
  background-size: 320% 100%;
  animation: gradientSlide 18s ease-in-out infinite;
  box-shadow: 0 6px 22px rgba(194, 65, 12, 0.35);
  border-bottom: 4px solid #ffd8ae;
}

.topbar-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 14px 0;
}

.brand {
  display: flex;
  align-items: center;
  gap: 14px;
  cursor: pointer;
  user-select: none;
  border: 0;
  background: transparent;
  padding: 0;
}

.brand-icon {
  width: 56px;
  height: 56px;
  display: grid;
  place-items: center;
  font-size: 30px;
  border-radius: 19px;
  background: linear-gradient(150deg, #fff7df, #ffe6b8);
  box-shadow: 0 6px 0 #e0a95f, 0 10px 18px rgba(120, 53, 15, 0.25);
  animation: mascotBoing 3.4s ease-in-out infinite;
}

.brand-text {
  text-align: left;
}

.brand-title {
  font-size: 25px;
  font-weight: bold;
  color: #ffffff;
  letter-spacing: 0.4px;
  text-shadow: 0 2px 0 rgba(154, 52, 18, 0.35);
}

.brand-sub {
  font-size: 12px;
  color: #fff3e0;
  letter-spacing: 1.6px;
  text-transform: uppercase;
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.chip {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 10px 18px;
  border-radius: var(--radius-pill);
  background: var(--paper);
  color: var(--carrot-dark);
  font-weight: bold;
  font-size: 17px;
  box-shadow: 0 5px 0 #ffd8ae;
  white-space: nowrap;
}

.chip-icon {
  font-size: 20px;
  animation: sway 4s ease-in-out infinite;
}

.chip.pop {
  animation: chipPop 0.6s ease;
}

.icon-btn {
  width: 46px;
  height: 46px;
  display: grid;
  place-items: center;
  font-size: 21px;
  border: 0;
  border-radius: 15px;
  cursor: pointer;
  background: rgba(255, 255, 255, 0.92);
  box-shadow: 0 5px 0 #ffd8ae;
  transition: transform var(--fast) ease, background var(--fast) ease;
}

.icon-btn:hover {
  transform: translateY(-3px) scale(1.05);
  background: #fff6e3;
}

.icon-btn:active {
  transform: translateY(1px) scale(0.97);
}

.icon-btn.muted {
  opacity: 0.65;
}

.hero {
  position: relative;
  display: grid;
  grid-template-columns: 1.65fr 1fr;
  gap: 26px;
  align-items: center;
  padding: 34px;
  margin-bottom: 34px;
  border-radius: var(--radius-xl);
  border: 3px solid #ffe0b0;
  background: linear-gradient(135deg, #ffffff 0%, #fff8ec 55%, #fff2f7 100%);
  box-shadow: var(--shadow-md);
  overflow: hidden;
}

.hero::after {
  content: "🍓  🍪  🍕  🍩";
  position: absolute;
  top: 10px;
  right: 20px;
  font-size: 22px;
  opacity: 0.85;
  animation: sway 5s ease-in-out infinite;
}

.hero-eyebrow {
  display: inline-block;
  padding: 6px 14px;
  margin-bottom: 12px;
  border-radius: var(--radius-pill);
  background: var(--mint-soft);
  color: var(--basil);
  font-size: 13px;
  font-weight: bold;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.hero-title {
  font-size: clamp(30px, 6vw, 46px);
  margin-bottom: 10px;
}

.hero-text {
  color: var(--muted);
  font-size: 17px;
  max-width: 46ch;
}

.hero-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 20px;
}

.mascot {
  position: relative;
  display: grid;
  place-items: center;
  padding: 18px;
  border-radius: 28px;
  background: linear-gradient(150deg, #fff4cd, #ffe2d1 55%, #e8ffdc);
  border: 3px dashed var(--honey);
}

.mascot-body {
  font-size: clamp(58px, 12vw, 88px);
  animation: mascotBoing 2.8s ease-in-out infinite;
}

.mascot-shadow {
  width: 90px;
  height: 14px;
  margin-top: 6px;
  border-radius: 50%;
  background: rgba(146, 64, 14, 0.15);
  animation: shadowBreathe 2.8s ease-in-out infinite;
}

.mascot-name {
  margin-top: 8px;
  font-size: 15px;
  font-weight: bold;
  color: var(--cocoa);
}

.bubble {
  position: relative;
  margin-top: 14px;
  padding: 10px 16px;
  border-radius: 16px;
  background: #ffffff;
  border: 2px solid var(--line);
  color: var(--cocoa);
  font-size: 14px;
  text-align: center;
  animation: bubbleFloat 4s ease-in-out infinite;
}

.bubble::after {
  content: "";
  position: absolute;
  left: 50%;
  top: -10px;
  transform: translateX(-50%) rotate(45deg);
  width: 16px;
  height: 16px;
  background: #ffffff;
  border-left: 2px solid var(--line);
  border-top: 2px solid var(--line);
}

.btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  padding: 15px 26px;
  border: 0;
  border-radius: var(--radius-md);
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  overflow: hidden;
  transition: transform var(--fast) ease, box-shadow var(--fast) ease, filter var(--fast) ease;
}

.btn:hover {
  filter: brightness(1.05);
  transform: translateY(-3px);
}

.btn:active {
  transform: translateY(1px);
}

.btn::before {
  content: "";
  position: absolute;
  top: 0;
  left: -120%;
  width: 60%;
  height: 100%;
  background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.55), transparent);
  transform: skewX(-18deg);
}

.btn:hover::before {
  animation: shineSweep 0.85s ease;
}

.btn-primary {
  background: linear-gradient(95deg, #fb923c, #ef4444);
  color: #ffffff;
  box-shadow: 0 6px 0 var(--carrot-dark), var(--shadow-sm);
}

.btn-secondary {
  background: #ffffff;
  color: var(--carrot-dark);
  border: 3px solid var(--honey-soft);
  box-shadow: 0 5px 0 #ffe2b0;
}

.btn-ghost {
  background: var(--dough);
  color: var(--cocoa);
  border: 2px solid var(--line);
  box-shadow: 0 4px 0 #ffe2b0;
}

.btn-mint {
  background: linear-gradient(95deg, #34d399, #059669);
  color: #ffffff;
  box-shadow: 0 6px 0 #047857;
}

.btn-berry {
  background: linear-gradient(95deg, #fb7185, #e11d48);
  color: #ffffff;
  box-shadow: 0 6px 0 #9f1239;
}

.btn-big {
  font-size: 19px;
  padding: 18px 34px;
  border-radius: var(--radius-lg);
}

.btn-sm {
  font-size: 14px;
  padding: 10px 16px;
  border-radius: var(--radius-sm);
}

.btn[disabled] {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
}

.ripple {
  position: absolute;
  border-radius: 50%;
  transform: scale(0);
  background: rgba(255, 255, 255, 0.7);
  animation: rippleOut 0.6s ease-out forwards;
  pointer-events: none;
}

.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  flex-wrap: wrap;
  margin: 6px 0 18px;
}

.section-title {
  font-size: 27px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.section-title .emoji {
  animation: sway 4.5s ease-in-out infinite;
}

.section-note {
  font-size: 14px;
  color: var(--muted);
}

.lessons {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 18px;
}

.lesson-card {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 22px 18px 18px;
  border: 3px solid #ffffff;
  border-radius: var(--radius-lg);
  cursor: pointer;
  text-align: left;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  transition: transform var(--normal) ease, box-shadow var(--normal) ease;
}

.lesson-card:hover {
  transform: translateY(-8px) rotate(-1deg);
  box-shadow: var(--shadow-lg);
}

.lesson-card:active {
  transform: translateY(-2px) scale(0.99);
}

.lesson-card::before {
  content: "";
  position: absolute;
  top: -60%;
  left: -30%;
  width: 60%;
  height: 220%;
  background: linear-gradient(100deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.6), rgba(255, 255, 255, 0));
  transform: rotate(18deg) translateX(-160%);
  transition: transform 0.7s ease;
}

.lesson-card:hover::before {
  transform: rotate(18deg) translateX(320%);
}

.lesson-card.tone-1 { background: linear-gradient(150deg, #ffd7dc, #ffe9ef); }
.lesson-card.tone-2 { background: linear-gradient(150deg, #ffe6a8, #fff6d3); }
.lesson-card.tone-3 { background: linear-gradient(150deg, #ffd6ae, #ffeada); }
.lesson-card.tone-4 { background: linear-gradient(150deg, #d9f8c4, #ecffe2); }
.lesson-card.tone-5 { background: linear-gradient(150deg, #ffe3b8, #fff2d6); }
.lesson-card.tone-6 { background: linear-gradient(150deg, #d6f2ff, #eafaff); }
.lesson-card.tone-7 { background: linear-gradient(150deg, #ffded1, #fff0e8); }
.lesson-card.tone-8 { background: linear-gradient(150deg, #e8dcff, #f4eeff); }
.lesson-card.tone-9 { background: linear-gradient(150deg, #ffe9c4, #fff8e6); }
.lesson-card.tone-10 { background: linear-gradient(150deg, #d8ffe8, #eefff6); }

.lesson-icon {
  width: 62px;
  height: 62px;
  display: grid;
  place-items: center;
  font-size: 34px;
  border-radius: 20px;
  background: rgba(255, 255, 255, 0.85);
  box-shadow: 0 4px 0 rgba(146, 64, 14, 0.12);
  transition: transform var(--fast) ease;
}

.lesson-card:hover .lesson-icon {
  animation: wiggle 0.6s ease;
}

.lesson-title {
  font-size: 19px;
  color: var(--cocoa);
}

.lesson-desc {
  font-size: 13.5px;
  color: #6f5b4a;
  min-height: 40px;
}

.lesson-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-top: auto;
}

.lesson-best {
  font-size: 12.5px;
  font-weight: bold;
  color: var(--carrot-dark);
  background: rgba(255, 255, 255, 0.8);
  border-radius: var(--radius-pill);
  padding: 5px 11px;
}

.lesson-best.fresh {
  color: var(--mint-dark);
}

.lesson-go {
  font-size: 13px;
  font-weight: bold;
  color: var(--cocoa);
  background: rgba(255, 255, 255, 0.65);
  border-radius: var(--radius-sm);
  padding: 6px 10px;
  transition: background var(--fast) ease, transform var(--fast) ease;
}

.lesson-card:hover .lesson-go {
  background: #ffffff;
  transform: translateX(3px);
}

.lesson-ribbon {
  position: absolute;
  top: 10px;
  right: -34px;
  transform: rotate(38deg);
  padding: 4px 40px;
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 0.6px;
  color: #ffffff;
  background: linear-gradient(95deg, #34d399, #059669);
  box-shadow: 0 3px 8px rgba(4, 120, 87, 0.35);
}

.quiz {
  max-width: 820px;
  margin: 0 auto;
  padding: 28px;
  border: 3px solid #ffe2bd;
  border-radius: var(--radius-xl);
  background: linear-gradient(160deg, #ffffff 0%, #fffaf2 100%);
  box-shadow: var(--shadow-md);
  animation: riseIn 0.5s ease both;
}

.quiz-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}

.quiz-title {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 16px;
  font-weight: bold;
  color: var(--cocoa);
}

.quiz-count {
  font-size: 14px;
  font-weight: bold;
  color: var(--cocoa);
  background: var(--dough);
  border: 2px solid var(--line);
  border-radius: var(--radius-pill);
  padding: 5px 14px;
}

.streak {
  display: none;
  align-items: center;
  gap: 6px;
  font-size: 14px;
  font-weight: bold;
  color: var(--berry);
  background: var(--berry-soft);
  border: 2px solid #ffc9d6;
  border-radius: var(--radius-pill);
  padding: 5px 13px;
}

.streak.show {
  display: inline-flex;
  animation: popIn 0.4s ease;
}

.streak-fire {
  animation: flicker 1.2s ease-in-out infinite;
}

.bar {
  position: relative;
  height: 16px;
  border-radius: var(--radius-pill);
  background: #ffe9d6;
  box-shadow: inset 0 2px 4px rgba(146, 64, 14, 0.14);
  overflow: hidden;
  margin-bottom: 24px;
}

.bar-fill {
  height: 100%;
  width: 0%;
  border-radius: var(--radius-pill);
  background: linear-gradient(95deg, var(--honey), var(--carrot), var(--berry));
  transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  position: relative;
  overflow: hidden;
}

.bar-fill::after {
  content: "";
  position: absolute;
  inset: 0;
  background-image: repeating-linear-gradient(
    115deg,
    rgba(255, 255, 255, 0.35) 0 12px,
    rgba(255, 255, 255, 0) 12px 24px
  );
  animation: stripeMove 1.2s linear infinite;
}

.plaque {
  position: relative;
  margin: 6px 0 18px;
  padding: 24px 16px;
  border: 3px dotted var(--honey);
  border-radius: var(--radius-lg);
  background: linear-gradient(135deg, #fff8e1 0%, #ffe8ef 50%, #eaffe2 100%);
  text-align: center;
  overflow: hidden;
}

.plaque-food {
  font-size: clamp(30px, 6.5vw, 46px);
  line-height: 1.7;
  letter-spacing: 4px;
  word-break: break-word;
}

.plaque-food span {
  display: inline-block;
  animation: bobble 3s ease-in-out infinite;
}

.question {
  text-align: center;
  font-size: clamp(21px, 4.4vw, 27px);
  color: var(--carrot-dark);
  margin: 6px 0 20px;
  animation: riseIn 0.45s ease both;
}

.answers {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
}

.answer {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 20px 12px;
  min-height: 76px;
  border: 3px solid #ffd8a8;
  border-radius: var(--radius-md);
  background: #ffffff;
  box-shadow: 0 5px 0 #ffe4c4;
  color: var(--carrot-dark);
  font-size: 19px;
  font-weight: bold;
  cursor: pointer;
  transition: transform var(--fast) ease, background var(--fast) ease, border-color var(--fast) ease;
}

.answer:hover:not([disabled]) {
  background: #fff7de;
  border-color: var(--carrot);
  transform: translateY(-3px) scale(1.02);
}

.answer:active:not([disabled]) {
  transform: translateY(1px) scale(0.99);
}

.answer[disabled] {
  cursor: default;
}

.answer-key {
  position: absolute;
  top: 6px;
  left: 10px;
  width: 22px;
  height: 22px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  font-size: 11px;
  font-weight: bold;
  background: var(--dough);
  color: var(--cocoa);
}

.answer.correct {
  background: var(--mint-soft);
  border-color: var(--mint);
  color: var(--mint-dark);
  animation: correctBounce 0.6s ease;
}

.answer.wrong {
  background: #ffe4e6;
  border-color: #fb7185;
  color: #be123c;
  animation: wrongShake 0.5s ease;
}

.answer.dimmed {
  opacity: 0.55;
}

.feedback {
  display: none;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-top: 20px;
  padding: 15px 18px;
  border-radius: var(--radius-md);
  font-size: 17px;
  font-weight: bold;
  text-align: center;
}

.feedback.show {
  display: flex;
  animation: riseIn 0.35s ease both;
}

.feedback.ok {
  background: var(--mint-soft);
  border: 2px solid #86efac;
  color: var(--basil);
}

.feedback.no {
  background: #fff3e6;
  border: 2px solid #fdba74;
  color: #9a3412;
}

.feedback .big {
  font-size: 22px;
}

.quiz-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 18px;
}

.quiz-actions .right {
  display: flex;
  gap: 10px;
  margin-left: auto;
}

.pulse-ready {
  animation: gentlePulse 1.6s ease-in-out infinite;
}

.finish {
  position: relative;
  max-width: 760px;
  margin: 0 auto;
  padding: 34px 28px;
  text-align: center;
  border: 3px solid #ffe2bd;
  border-radius: var(--radius-xl);
  background: linear-gradient(150deg, #fff7d1 0%, #ffe7d9 45%, #e9ffe1 100%);
  box-shadow: var(--shadow-lg);
  animation: zoomIn 0.5s ease both;
  overflow: hidden;
}

.finish-badge {
  font-size: 82px;
  line-height: 1;
  animation: trophyHop 1.6s ease-in-out infinite;
}

.finish-title {
  font-size: clamp(24px, 5vw, 34px);
  margin: 10px 0 6px;
}

.finish-sub {
  color: #7a5b41;
  font-size: 17px;
}

.stars {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin: 18px 0 6px;
  font-size: 42px;
}

.star {
  opacity: 0.28;
  filter: grayscale(1);
  transform: scale(0.8);
}

.star.on {
  opacity: 1;
  filter: none;
  animation: starPop 0.7s cubic-bezier(0.2, 1.4, 0.4, 1) both;
}

.points-earned {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin: 14px 0 8px;
  padding: 12px 22px;
  border-radius: var(--radius-pill);
  background: #ffffff;
  border: 3px dashed var(--honey);
  color: var(--carrot-dark);
  font-size: 19px;
  font-weight: bold;
}

.finish-actions {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 22px;
}

.finish-note {
  margin-top: 16px;
  font-size: 14px;
  color: #8a6a4f;
  font-style: italic;
}

.new-badges {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 18px;
}

.badge-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 9px 16px;
  border-radius: var(--radius-pill);
  background: #ffffff;
  border: 2px solid var(--honey-soft);
  font-size: 14px;
  font-weight: bold;
  color: var(--cocoa);
  box-shadow: var(--shadow-sm);
  animation: badgeFlip 0.7s ease both;
}

.badge-pill .tag {
  font-size: 11px;
  letter-spacing: 0.8px;
  color: #ffffff;
  background: var(--berry);
  border-radius: var(--radius-pill);
  padding: 2px 8px;
}

.trophy {
  max-width: 900px;
  margin: 0 auto;
  animation: riseIn 0.45s ease both;
}

.panel {
  padding: 26px;
  margin-bottom: 20px;
  border: 3px solid #ffe2bd;
  border-radius: var(--radius-xl);
  background: #ffffff;
  box-shadow: var(--shadow-sm);
}

.panel-title {
  font-size: 21px;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.badge-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 14px;
}

.badge-tile {
  padding: 16px 12px;
  border-radius: var(--radius-md);
  border: 3px solid var(--line);
  background: linear-gradient(150deg, #fffdf7, #fff5e6);
  text-align: center;
  transition: transform var(--normal) ease;
}

.badge-tile:hover {
  transform: translateY(-5px) rotate(-1deg);
}

.badge-tile.locked {
  background: #f6f1ea;
  border-color: #ece2d4;
  color: #b6a696;
  filter: grayscale(0.85);
}

.badge-icon {
  font-size: 38px;
  line-height: 1.2;
}

.badge-name {
  font-size: 14px;
  font-weight: bold;
  margin-top: 4px;
}

.badge-need {
  font-size: 12px;
  color: var(--muted);
  margin-top: 2px;
}

.best-list {
  display: grid;
  gap: 10px;
}

.best-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 16px;
  border-radius: var(--radius-md);
  background: var(--dough);
  border: 2px solid var(--line);
}

.best-row .row-icon {
  font-size: 22px;
}

.best-row .row-name {
  font-weight: bold;
  color: var(--cocoa);
}

.best-row .row-stars {
  margin-left: auto;
  letter-spacing: 3px;
}

.best-row .row-empty {
  font-size: 13px;
  color: var(--muted);
}

.overlay {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(67, 37, 26, 0.55);
  backdrop-filter: blur(3px);
}

.overlay.show {
  display: flex;
  animation: fadeIn 0.3s ease both;
}

.modal {
  width: 100%;
  max-width: 620px;
  max-height: 88vh;
  overflow: auto;
  padding: 26px;
  border: 3px solid var(--line);
  border-radius: var(--radius-xl);
  background: #ffffff;
  box-shadow: var(--shadow-lg);
  animation: zoomIn 0.35s ease both;
}

.modal-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
}

.modal-title {
  font-size: 23px;
}

.modal-body {
  color: #5d4a3b;
  font-size: 16px;
}

.modal-body ol,
.modal-body ul {
  padding-left: 22px;
  margin: 10px 0;
}

.modal-body li {
  margin-bottom: 8px;
}

.modal-close {
  width: 40px;
  height: 40px;
  border: 0;
  border-radius: 12px;
  background: var(--dough);
  cursor: pointer;
  font-size: 20px;
  box-shadow: 0 4px 0 #ffe2b0;
}

.modal-close:hover {
  background: #fff3c9;
}

footer {
  position: relative;
  z-index: 1;
  padding: 24px 18px;
  text-align: center;
  font-size: 13.5px;
  color: #7a6754;
  background: linear-gradient(90deg, #ffe9c4, #ffe3e6, #e9ffe0);
  border-top: 3px dashed #ffd9a0;
}

footer .foot-line {
  margin-bottom: 4px;
}

footer .foot-tip {
  font-size: 12.5px;
  color: #8d7a67;
}

.tip {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 30px;
  padding: 18px 20px;
  border-radius: var(--radius-lg);
  border: 2px solid var(--honey);
  background: linear-gradient(90deg, #fff6c4, #ffe6d0);
  color: #6b4b1e;
  font-size: 15px;
}

.tip .tip-icon {
  font-size: 24px;
  animation: flicker 1.8s ease-in-out infinite;
}

.mini-cards {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
  margin-top: 8px;
}

.mini-card {
  padding: 16px;
  border-radius: var(--radius-md);
  border: 2px dashed var(--line);
  background: #fffdf7;
  text-align: center;
}

.mini-card .mini-icon {
  font-size: 30px;
}

.mini-card h4 {
  margin: 8px 0 4px;
  font-size: 15px;
}

.mini-card p {
  font-size: 13px;
  color: var(--muted);
}

@keyframes gradientSlide {
  0%   { background-position: 0% 50%; }
  50%  { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

@keyframes mascotBoing {
  0%   { transform: translateY(0) rotate(-2deg); }
  25%  { transform: translateY(-7px) rotate(2deg); }
  50%  { transform: translateY(0) rotate(-1deg); }
  75%  { transform: translateY(-4px) rotate(1deg); }
  100% { transform: translateY(0) rotate(-2deg); }
}

@keyframes shadowBreathe {
  0%   { transform: scaleX(1); opacity: 0.20; }
  50%  { transform: scaleX(0.86); opacity: 0.13; }
  100% { transform: scaleX(1); opacity: 0.20; }
}

@keyframes sway {
  0%   { transform: rotate(-6deg); }
  50%  { transform: rotate(6deg); }
  100% { transform: rotate(-6deg); }
}

@keyframes slowSpin {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}

@keyframes drift {
  0%   { transform: translate3d(0, 0, 0) scale(1); }
  50%  { transform: translate3d(26px, -34px, 0) scale(1.08); }
  100% { transform: translate3d(0, 0, 0) scale(1); }
}

@keyframes bobble {
  0%   { transform: translateY(0); }
  40%  { transform: translateY(-8px); }
  100% { transform: translateY(0); }
}

@keyframes bubbleFloat {
  0%   { transform: translateY(0); }
  50%  { transform: translateY(-5px); }
  100% { transform: translateY(0); }
}

@keyframes shineSweep {
  from { left: -120%; }
  to   { left: 130%; }
}

@keyframes chipPop {
  0%   { transform: scale(1); }
  35%  { transform: scale(1.22) rotate(-3deg); }
  65%  { transform: scale(0.96) rotate(2deg); }
  100% { transform: scale(1); }
}

@keyframes riseIn {
  from { opacity: 0; transform: translateY(22px); }
  to   { opacity: 1; transform: translateY(0); }
}

@keyframes zoomIn {
  from { opacity: 0; transform: scale(0.9) translateY(10px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}

@keyframes fadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}

@keyframes popIn {
  0%   { opacity: 0; transform: scale(0.6); }
  70%  { opacity: 1; transform: scale(1.12); }
  100% { opacity: 1; transform: scale(1); }
}

@keyframes correctBounce {
  0%   { transform: scale(1); }
  30%  { transform: scale(1.08); }
  55%  { transform: scale(0.98); }
  100% { transform: scale(1); }
}

@keyframes wrongShake {
  0%   { transform: translateX(0); }
  20%  { transform: translateX(-9px); }
  40%  { transform: translateX(8px); }
  60%  { transform: translateX(-5px); }
  80%  { transform: translateX(3px); }
  100% { transform: translateX(0); }
}

@keyframes wiggle {
  0%   { transform: rotate(0deg); }
  25%  { transform: rotate(-11deg) scale(1.06); }
  55%  { transform: rotate(9deg) scale(1.04); }
  100% { transform: rotate(0deg); }
}

@keyframes stripeMove {
  from { background-position: 0 0; }
  to   { background-position: 48px 0; }
}

@keyframes rippleOut {
  to { transform: scale(2.6); opacity: 0; }
}

@keyframes gentlePulse {
  0%   { transform: scale(1); box-shadow: 0 6px 0 #047857; }
  50%  { transform: scale(1.045); box-shadow: 0 8px 0 #047857; }
  100% { transform: scale(1); box-shadow: 0 6px 0 #047857; }
}

@keyframes trophyHop {
  0%   { transform: translateY(0) rotate(-4deg); }
  30%  { transform: translateY(-14px) rotate(3deg); }
  60%  { transform: translateY(0) rotate(-2deg); }
  100% { transform: translateY(0) rotate(-4deg); }
}

@keyframes starPop {
  0%   { opacity: 0; transform: scale(0.2) rotate(-40deg); }
  60%  { opacity: 1; transform: scale(1.3) rotate(12deg); }
  100% { opacity: 1; transform: scale(1) rotate(0deg); }
}

@keyframes badgeFlip {
  0%   { opacity: 0; transform: rotateY(90deg) scale(0.8); }
  100% { opacity: 1; transform: rotateY(0deg) scale(1); }
}

@keyframes flicker {
  0%   { transform: scale(1) rotate(-3deg); opacity: 1; }
  40%  { transform: scale(1.12) rotate(3deg); opacity: 0.9; }
  100% { transform: scale(1) rotate(-3deg); opacity: 1; }
}

@keyframes confettiFall {
  0%   { transform: translateY(-10vh) rotate(0deg) scale(1); opacity: 1; }
  70%  { opacity: 1; }
  100% { transform: translateY(105vh) rotate(720deg) scale(0.9); opacity: 0; }
}

@keyframes confettiSway {
  0%   { margin-left: 0; }
  50%  { margin-left: 60px; }
  100% { margin-left: -20px; }
}

@keyframes starRain {
  0%   { transform: translateY(-8vh) scale(0.6); opacity: 0; }
  15%  { opacity: 1; }
  100% { transform: translateY(105vh) scale(1.1); opacity: 0; }
}

@keyframes sparkleOut {
  0%   { transform: translate(0, 0) scale(0.4); opacity: 1; }
  100% { transform: translate(var(--dx), var(--dy)) scale(1.15); opacity: 0; }
}

@keyframes cardIn {
  0%   { opacity: 0; transform: translateY(26px) scale(0.96); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes cardShiver {
  0%   { transform: translateX(0); }
  25%  { transform: translateX(-6px) rotate(-0.4deg); }
  50%  { transform: translateX(6px) rotate(0.4deg); }
  75%  { transform: translateX(-3px); }
  100% { transform: translateX(0); }
}

@keyframes glowPulse {
  0%   { box-shadow: 0 0 0 0 rgba(251, 113, 133, 0.55); }
  70%  { box-shadow: 0 0 0 12px rgba(251, 113, 133, 0); }
  100% { box-shadow: 0 0 0 0 rgba(251, 113, 133, 0); }
}

@keyframes tickTock {
  0%   { transform: rotate(-8deg); }
  50%  { transform: rotate(8deg); }
  100% { transform: rotate(-8deg); }
}

@keyframes dotBlink {
  0%   { opacity: 0.25; transform: scale(0.85); }
  50%  { opacity: 1; transform: scale(1.15); }
  100% { opacity: 0.25; transform: scale(0.85); }
}

@keyframes badgeGlow {
  0%   { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.6); }
  60%  { box-shadow: 0 0 0 14px rgba(251, 191, 36, 0); }
  100% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0); }
}

.pop       { animation: popIn 0.4s ease both; }
.bounce    { animation: correctBounce 0.6s ease; }
.shake     { animation: wrongShake 0.5s ease; }
.wiggle    { animation: wiggle 0.6s ease; }
.bobble    { animation: bobble 3s ease-in-out infinite; }
.blink     { animation: dotBlink 1.4s ease-in-out infinite; }
.glow      { animation: glowPulse 2s ease-out infinite; }
.tocking   { animation: tickTock 2s ease-in-out infinite; }

.fade-in   { animation: fadeIn 0.45s ease both; }
.rise-in   { animation: riseIn 0.45s ease both; }
.card-in   { animation: cardIn 0.5s ease both; }
.shiver    { animation: cardShiver 0.45s ease; }

.d1  { animation-delay: 0.05s; }
.d2  { animation-delay: 0.10s; }
.d3  { animation-delay: 0.15s; }
.d4  { animation-delay: 0.20s; }
.d5  { animation-delay: 0.25s; }
.d6  { animation-delay: 0.30s; }
.d7  { animation-delay: 0.35s; }
.d8  { animation-delay: 0.40s; }
.d9  { animation-delay: 0.45s; }
.d10 { animation-delay: 0.50s; }
.d11 { animation-delay: 0.55s; }
.d12 { animation-delay: 0.60s; }
.d13 { animation-delay: 0.65s; }
.d14 { animation-delay: 0.70s; }
.d15 { animation-delay: 0.75s; }
.d16 { animation-delay: 0.80s; }
.d17 { animation-delay: 0.85s; }
.d18 { animation-delay: 0.90s; }
.d19 { animation-delay: 0.95s; }
.d20 { animation-delay: 1.00s; }

#fx {
  position: fixed;
  inset: 0;
  z-index: 50;
  pointer-events: none;
  overflow: hidden;
}

.confetti {
  position: absolute;
  top: -40px;
  font-size: 24px;
  will-change: transform;
  animation-name: confettiFall;
  animation-timing-function: linear;
  animation-fill-mode: forwards;
}

.confetti.sway {
  animation-name: confettiFall, confettiSway;
  animation-timing-function: linear, ease-in-out;
  animation-fill-mode: forwards, none;
}

.rain-star {
  position: absolute;
  top: -40px;
  font-size: 26px;
  animation-name: starRain;
  animation-timing-function: linear;
  animation-fill-mode: forwards;
}

.sparkle {
  position: absolute;
  font-size: 20px;
  animation: sparkleOut 0.7s ease-out forwards;
}

@media (max-width: 1000px) {
  .lessons {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .badge-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .mini-cards {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 760px) {
  .lessons {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .hero {
    grid-template-columns: 1fr;
    text-align: left;
    padding: 26px;
  }

  .hero::after {
    font-size: 18px;
  }

  .brand-title {
    font-size: 21px;
  }

  .brand-sub {
    font-size: 11px;
    letter-spacing: 1px;
  }

  .badge-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 560px) {
  main#screen {
    padding: 20px 14px 60px;
  }

  .lessons {
    grid-template-columns: 1fr;
  }

  .answers {
    grid-template-columns: 1fr;
  }

  .answer {
    min-height: 64px;
    font-size: 18px;
  }

  .hero-title {
    font-size: 28px;
  }

  .topbar-inner {
    padding: 11px 0;
  }

  .brand-icon {
    width: 46px;
    height: 46px;
    font-size: 25px;
    border-radius: 15px;
  }

  .chip {
    font-size: 15px;
    padding: 9px 13px;
  }

  .icon-btn {
    width: 42px;
    height: 42px;
    font-size: 19px;
  }

  .quiz {
    padding: 20px 16px;
  }

  .mini-cards {
    grid-template-columns: 1fr;
  }

  .finish {
    padding: 26px 18px;
  }

  .stars {
    font-size: 34px;
  }
}

@media (max-width: 380px) {
  .brand-sub {
    display: none;
  }

  .lesson-desc {
    min-height: auto;
  }
}

@media (min-width: 1300px) {
  .wrap,
  main#screen {
    max-width: 1200px;
  }
}

@media (max-width: 560px) {
  .topbar-inner {
    gap: 8px;
  }

  .brand {
    min-width: 0;
  }

  .brand-text {
    min-width: 0;
  }

  .topbar-right {
    gap: 6px;
  }

  .icon-btn {
    width: 38px;
    height: 38px;
    font-size: 17px;
    border-radius: 12px;
  }

  .chip {
    padding: 8px 12px;
    font-size: 15px;
    gap: 6px;
  }

  .chip-label {
    display: none;
  }
}

@media (max-width: 430px) {
  .brand-sub {
    display: none;
  }

  .brand-title {
    font-size: 20px;
  }

  .topbar-right {
    gap: 7px;
  }

  .toast {
    font-size: 14px;
    padding: 11px 15px;
    max-width: 92vw;
  }

  .toast-icon {
    font-size: 24px;
  }

  .hero::after {
    display: none;
  }

  .mascot-body {
    font-size: 62px;
  }
}

@media (min-width: 1500px) {
  .lessons {
    grid-template-columns: repeat(5, minmax(0, 1fr));
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }

  .float-food {
    display: none;
  }
}

@media print {
  .topbar,
  footer,
  .float-food,
  #fx,
  .hero-actions,
  .finish-actions,
  .quiz-actions {
    display: none !important;
  }

  body {
    background: #ffffff;
  }

  .quiz,
  .panel,
  .finish {
    box-shadow: none;
    border-color: #cccccc;
  }
}

.toast {
  position: fixed;
  top: 92px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 70;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 20px;
  border-radius: var(--radius-pill);
  background: #ffffff;
  border: 3px solid var(--honey);
  box-shadow: var(--shadow-md);
  font-size: 16px;
  color: var(--cocoa);
  animation: toastIn 0.5s cubic-bezier(0.2, 1.3, 0.4, 1) both;
}

.toast-out {
  animation: toastOut 0.45s ease forwards;
}

.toast-icon {
  font-size: 30px;
  animation: mascotBoing 1.6s ease-in-out infinite;
}

.toast-text b {
  color: var(--carrot-dark);
}

.toast-tag {
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 1px;
  color: #ffffff;
  background: var(--berry);
  border-radius: var(--radius-pill);
  padding: 3px 10px;
}

.hero-left {
  position: relative;
  z-index: 2;
}

.hero-right {
  position: relative;
  z-index: 2;
}

.bonus {
  display: inline-block;
  margin-left: 6px;
  padding: 2px 10px;
  border-radius: var(--radius-pill);
  background: var(--berry-soft);
  color: var(--berry);
  font-size: 13px;
  font-weight: bold;
  animation: popIn 0.4s ease both;
}

.panel + .panel {
  margin-top: 0;
}

.quiz-top .streak {
  margin-left: auto;
}

.finish-sub b {
  color: var(--carrot-dark);
}

.lesson-card:focus-visible,
.answer:focus-visible,
.btn:focus-visible {
  outline: 4px solid var(--berry);
  outline-offset: 3px;
}

#worksheet {
  display: none;
}

.ws-line {
  font-size: 14px;
  margin: 10px 0;
}

.ws-note {
  font-size: 12.5px;
  color: #555555;
  margin-bottom: 14px;
}

.ws-lesson {
  margin: 18px 0 8px;
  padding-bottom: 4px;
  border-bottom: 2px solid #999999;

var STORE_KEY = "yummyMathDeluxeV1";

var currentScreen = "home";

var game = null;

function el(id) {
  return document.getElementById(id);
}

function randInt(low, high) {
  return Math.floor(Math.random() * (high - low + 1)) + low;
}

function pick(list) {
  return list[randInt(0, list.length - 1)];
}

function esc(text) {
  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function percent(part, whole) {
  if (!whole) {
    return 0;
  }
  return Math.round((part / whole) * 100);
}

function starRow(filled, total) {
  var text = "";
  for (var i = 0; i < total; i++) {
    text += (i < filled) ? "⭐" : "☆";
  }
  return text;
}

function starsFor(correct, total) {
  var ratio = total ? correct / total : 0;
  if (ratio >= 1) {
    return 3;
  }
  if (ratio >= 0.6) {
    return 2;
  }
  return 1;
}

function findLesson(id) {
  for (var i = 0; i < LESSONS.length; i++) {
    if (LESSONS[i].id === id) {
      return LESSONS[i];
    }
  }
  return null;
}

function nextLesson(id) {
  for (var i = 0; i < LESSONS.length; i++) {
    if (LESSONS[i].id === id && i + 1 < LESSONS.length) {
      return LESSONS[i + 1];
    }
  }
  return null;
}

function questionsOf(lesson) {
  var extra = [];
  if (typeof EXTRA_QUESTIONS !== "undefined" && EXTRA_QUESTIONS[lesson.id]) {
    extra = EXTRA_QUESTIONS[lesson.id];
  }
  return lesson.questions.concat(extra);
}

var DEFAULT_STATE = {
  points: 0,
  best: {},
  plays: {},
  badges: [],
  maxStreak: 0,
  muted: false,
  visits: 0
};

var state = DEFAULT_STATE;

function safeRead(key, fallback) {
  try {
    var raw = window.localStorage.getItem(key);
    if (!raw) {
      return fallback;
    }
    return JSON.parse(raw);
  } catch (error) {
    return fallback;
  }
}

function safeWrite(key, value) {
  try {
    window.localStorage.setItem(key, JSON.stringify(value));
  } catch (error) {

  }
}

function loadState() {
  var saved = safeRead(STORE_KEY, null);
  var fresh = {};
  var key;

  for (key in DEFAULT_STATE) {
    if (Object.prototype.hasOwnProperty.call(DEFAULT_STATE, key)) {
      fresh[key] = DEFAULT_STATE[key];
    }
  }

  if (saved && typeof saved === "object") {
    for (key in fresh) {
      if (Object.prototype.hasOwnProperty.call(saved, key)) {
        fresh[key] = saved[key];
      }
    }
  }

  if (typeof fresh.best !== "object" || fresh.best === null) {
    fresh.best = {};
  }
  if (typeof fresh.plays !== "object" || fresh.plays === null) {
    fresh.plays = {};
  }
  if (typeof fresh.badges !== "object" || fresh.badges === null) {
    fresh.badges = [];
  }
  if (typeof fresh.points !== "number" || isNaN(fresh.points)) {
    fresh.points = 0;
  }
  if (typeof fresh.maxStreak !== "number" || isNaN(fresh.maxStreak)) {
    fresh.maxStreak = 0;
  }
  if (typeof fresh.muted !== "boolean") {
    fresh.muted = false;
  }

  state = fresh;
  return state;
}

function saveState() {
  safeWrite(STORE_KEY, state);
}

function lessonsFinished() {
  return Object.keys(state.plays).length;
}

function perfectLessons() {
  var count = 0;
  for (var i = 0; i < LESSONS.length; i++) {
    var lesson = LESSONS[i];
    var total = questionsOf(lesson).length;
    if (state.best[lesson.id] === total && total > 0) {
      count++;
    }
  }
  return count;
}

function updateChip(animate) {
  var value = el("pointsValue");
  if (!value) {
    return;
  }
  value.textContent = state.points;

  if (animate) {
    var chip = el("pointsChip");
    if (chip) {
      chip.classList.remove("pop");
      void chip.offsetWidth;
      chip.classList.add("pop");
    }
  }
}

function addPoints(amount) {
  state.points += amount;
  saveState();
  updateChip(true);
}

function countAllQuestions() {
  var total = 0;
  for (var i = 0; i < LESSONS.length; i++) {
    total += questionsOf(LESSONS[i]).length;
  }
  return total;
}

function scrollToLessons() {
  var list = el("lessonList");
  if (list) {
    list.scrollIntoView({ behavior: "smooth", block: "start" });
  }
}

function startLesson(id) {
  var lesson = findLesson(id);
  if (!lesson) {
    return;
  }

  game = {
    lesson: lesson,
    list: questionsOf(lesson),
    index: 0,
    correct: 0,
    streak: 0,
    earned: 0,
    answered: false,
    picked: -1,
    streakBonus: 0
  };

  currentScreen = "quiz";
  renderQuestion();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function plaqueHTML(visual) {
  var parts = String(visual).split(/\s+/);
  var out = "";
  var i;

  for (i = 0; i < parts.length; i++) {
    if (!parts[i]) {
      continue;
    }
    out += '<span style="animation-delay:' + (i * 0.13).toFixed(2) + 's">' + esc(parts[i]) + '</span> ';
  }

  return '<div class="plaque"><div class="plaque-food">' + out + '</div></div>';
}

function renderQuestion() {
  var question = game.list[game.index];
  var total = game.list.length;
  var barWidth = percent(game.index + 1, total);
  var answersHTML = "";
  var letters = ["A", "B", "C", "D"];
  var i;

  for (i = 0; i < question.choices.length; i++) {
    answersHTML +=
      '<button class="answer" id="answer-' + i + '" onclick="chooseAnswer(' + i + ')">' +
        '<span class="answer-key">' + letters[i] + '</span>' +
        '<span>' + esc(question.choices[i]) + '</span>' +
      '</button>';
  }

  el("screen").innerHTML =
    '<div class="quiz" id="quizCard">' +
      '<div class="quiz-top">' +
        '<div class="quiz-title">' +
          '<span>' + game.lesson.icon + '</span>' +
          '<span>' + esc(game.lesson.title) + '</span>' +
        '</div>' +
        '<span class="quiz-count">Question ' + (game.index + 1) + ' of ' + total + '</span>' +
        '<span class="streak" id="streakPill">' +
          '<span class="streak-fire">🔥</span> <span id="streakText">0 in a row</span>' +
        '</span>' +
      '</div>' +

      '<div class="bar"><div class="bar-fill" id="barFill" style="width:' + barWidth + '%"></div></div>' +

      (question.visual ? plaqueHTML(question.visual) : "") +

      '<h2 class="question">' + esc(question.text) + '</h2>' +

      '<div class="answers" id="answers">' + answersHTML + '</div>' +

      '<div class="feedback" id="feedback"></div>' +

      '<div class="quiz-actions">' +
        '<button class="btn btn-ghost btn-sm" onclick="goHome()">← Lessons</button>' +
        '<div class="right">' +
          '<button class="btn btn-secondary" id="hintBtn" onclick="showHint()">💡 Hint</button>' +
          '<button class="btn btn-mint" id="nextBtn" onclick="goNext()" style="visibility:hidden">Next ➜</button>' +
        '</div>' +
      '</div>' +
    '</div>';

  updateStreakPill();
  attachRipples();
}

function updateStreakPill() {
  var pill = el("streakPill");
  var text = el("streakText");
  if (!pill || !text) {
    return;
  }

  if (game && game.streak >= 2) {
    text.textContent = game.streak + " in a row";
    pill.classList.add("show");
  } else {
    pill.classList.remove("show");
  }
}

function showHint() {
  var question = game.list[game.index];
  var feedback = el("feedback");

  feedback.className = "feedback no show";
  feedback.innerHTML = '<span class="big">💡</span><span>' + esc(question.hint) + '</span>';
  sfxPop();
}

function chooseAnswer(picked) {
  if (!game || game.answered) {
    return;
  }

  var question = game.list[game.index];
  var isRight = (picked === question.answer);
  var buttons = document.querySelectorAll(".answer");
  var i;

  game.answered = true;
  game.picked = picked;

  for (i = 0; i < buttons.length; i++) {
    buttons[i].setAttribute("disabled", "disabled");
    if (i !== question.answer && i !== picked) {
      buttons[i].classList.add("dimmed");
    }
  }

  var correctButton = el("answer-" + question.answer);
  if (correctButton) {
    correctButton.classList.add("correct");
  }

  if (isRight) {

    var bonus = (game.streak >= 2) ? 2 : 0;
    game.correct++;
    game.streak++;
    game.earned += 5 + bonus;
    game.streakBonus += bonus;

    if (game.streak > state.maxStreak) {
      state.maxStreak = game.streak;
    }

    addPoints(5 + bonus);

    var praise = pick(PRAISE);
    var bonusLine = bonus ? ' <span class="bonus">+2 streak bonus!</span>' : "";

    el("feedback").className = "feedback ok show";
    el("feedback").innerHTML =
      '<span class="big">🎉</span><span>' + esc(praise) + ' (+' + (5 + bonus) + ' points)' + bonusLine + '</span>';

    sfxCorrect();
    burstConfetti(14, FOOD_CONFETTI);
    sparkleBurst(70);
  } else {
    game.streak = 0;

    var forgive = pick(TRY_AGAIN);
    el("feedback").className = "feedback no show";
    el("feedback").innerHTML = '<span class="big">🙂</span><span>' + esc(forgive) + '</span>';

    var wrongButton = el("answer-" + picked);
    if (wrongButton) {
      wrongButton.classList.add("wrong");
    }

    sfxWrong();
    shiverCard();
  }

  updateStreakPill();
  checkBadges(false);

  var nextButton = el("nextBtn");
  if (nextButton) {
    nextButton.style.visibility = "visible";
    nextButton.classList.add("pulse-ready");
  }

  var hintButton = el("hintBtn");
  if (hintButton) {
    hintButton.setAttribute("disabled", "disabled");
  }
}

function shiverCard() {
  var card = el("quizCard");
  if (!card) {
    return;
  }
  card.classList.remove("shiver");
  void card.offsetWidth;
  card.classList.add("shiver");
}

function goNext() {
  if (!game || !game.answered) {
    return;
  }

  sfxClick();

  game.index++;
  game.answered = false;
  game.picked = -1;

  if (game.index < game.list.length) {
    renderQuestion();
  } else {
    finishLesson();
  }
}

function finishLesson() {
  var lesson = game.lesson;
  var total = game.list.length;
  var correct = game.correct;
  var stars = starsFor(correct, total);
  var best = state.best[lesson.id] || 0;
  var newBadges;
  var headline;
  var badgeFace;
  var starsHTML = "";
  var badgesHTML = "";
  var nextButton;
  var i;

  if (correct > best) {
    state.best[lesson.id] = correct;
  }
  state.plays[lesson.id] = (state.plays[lesson.id] || 0) + 1;
  saveState();

  newBadges = checkBadges(true);

  if (correct === total) {
    headline = pick(FINISH_PERFECT);
    badgeFace = "🏆";
  } else if (percent(correct, total) >= 60) {
    headline = pick(FINISH_GOOD);
    badgeFace = "🎉";
  } else {
    headline = pick(FINISH_KEEP_GOING);
    badgeFace = "🌱";
  }

  for (i = 0; i < 3; i++) {
    starsHTML +=
      '<span class="star' + (i < stars ? " on" : "") + ' d' + (i + 1) + '">' +
        (i < stars ? "⭐" : "☆") +
      '</span>';
  }

  if (newBadges.length) {
    badgesHTML += '<div class="new-badges">';
    for (i = 0; i < newBadges.length; i++) {
      badgesHTML +=
        '<span class="badge-pill d' + (i + 1) + '">' +
          '<span>' + newBadges[i].icon + '</span>' +
          '<span>' + esc(newBadges[i].name) + '</span>' +
          '<span class="tag">NEW BADGE</span>' +
        '</span>';
    }
    badgesHTML += '</div>';
  }

  var next = nextLesson(lesson.id);

  if (next) {
    nextButton =
      '<button class="btn btn-mint btn-big" onclick="startLesson(\'' + next.id + '\')">' +
        next.icon + ' Next lesson →' +
      '</button>';
  } else {
    nextButton = '<button class="btn btn-mint btn-big" onclick="showTrophy()">🏆 See my badges</button>';
  }

  el("screen").innerHTML =
    '<div class="finish">' +
      '<div class="finish-badge">' + badgeFace + '</div>' +
      '<h2 class="finish-title">' + esc(pick(CHEERS)) + '</h2>' +
      '<p class="finish-sub">' + esc(headline) + '</p>' +

      '<div class="stars">' + starsHTML + '</div>' +

      '<div class="points-earned">' +
        '<span>🍪</span><span>You earned ' + game.earned + ' points</span>' +
      '</div>' +

      '<p class="finish-sub">You answered <b>' + correct + ' of ' + total +
        '</b> questions correctly in <b>' + esc(lesson.title) + '</b>.<br>' +
        'Your best score here is <b>' + state.best[lesson.id] + ' of ' + total + '</b>.</p>' +

      (game.streakBonus ? '<p class="finish-note">🔥 You also earned ' + game.streakBonus + ' extra points from streaks!</p>' : "") +

      badgesHTML +

      '<div class="finish-actions">' +
        '<button class="btn btn-primary btn-big" onclick="startLesson(\'' + lesson.id + '\')">🔁 Play again</button>' +
        nextButton +
        '<button class="btn btn-secondary" onclick="goHome()">🏠 All lessons</button>' +
        '<button class="btn btn-ghost" onclick="printWorksheet(\'' + lesson.id + '\')">🖨️ Worksheet</button>' +
      '</div>' +

      '<p class="finish-note">💡 ' + esc(pick(FUN_FACTS)) + '</p>' +
    '</div>';

  burstConfetti(46, FOOD_CONFETTI);
  starRain(26);
  sfxWin();
  attachRipples();

function checkBadges(showNow) {
  var earned = [];
  var i;

  for (i = 0; i < BADGES.length; i++) {
    var badge = BADGES[i];
    var already = state.badges.indexOf(badge.id) !== -1;
    var gotIt = false;

    if (already) {
      continue;
    }

    if (badge.kind === "points" && state.points >= badge.need) {
      gotIt = true;
    } else if (badge.kind === "lessons" && lessonsFinished() >= badge.need) {
      gotIt = true;
    } else if (badge.kind === "perfect" && perfectLessons() >= badge.need) {
      gotIt = true;
    } else if (badge.kind === "streak" && state.maxStreak >= badge.need) {
      gotIt = true;
    } else if (badge.kind === "all" && lessonsFinished() >= LESSONS.length) {
      gotIt = true;
    }

    if (gotIt) {
      state.badges.push(badge.id);
      earned.push(badge);
    }
  }

  if (earned.length) {
    saveState();
    if (!showNow) {
      showBadgeToast(earned[0]);
      sfxBadge();
    }
  }

  return earned;
}

var audioCtx = null;

function initAudio() {
  try {
    var Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) {
      return;
    }
    if (!audioCtx) {
      audioCtx = new Ctor();
    }
    if (audioCtx.state === "suspended") {
      audioCtx.resume();
    }
  } catch (error) {
    audioCtx = null;
  }
}

function tone(frequency, startAfter, length, type, volume) {
  if (!audioCtx || state.muted) {
    return;
  }
  try {
    var now = audioCtx.currentTime + startAfter;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();

    osc.type = type || "sine";
    osc.frequency.value = frequency;

    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(volume || 0.16, now + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + length);

    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + length + 0.03);
  } catch (error) {

  }
}

function attachRipples() {
  var buttons = document.querySelectorAll(".btn");
  var i;

  for (i = 0; i < buttons.length; i++) {
    if (buttons[i].dataset.ripple === "yes") {
      continue;
    }
    buttons[i].dataset.ripple = "yes";
    buttons[i].addEventListener("click", rippleOnButton);
  }
}

function rippleOnButton(event) {
  var button = event.currentTarget;
  var box = button.getBoundingClientRect();
  var size = Math.max(box.width, box.height);
  var ripple = document.createElement("span");

  ripple.className = "ripple";
  ripple.style.width = size + "px";
  ripple.style.height = size + "px";
  ripple.style.left = (event.clientX - box.left - size / 2) + "px";
  ripple.style.top = (event.clientY - box.top - size / 2) + "px";

  button.appendChild(ripple);

  setTimeout(function () {
    if (ripple.parentNode) {
      ripple.parentNode.removeChild(ripple);
    }
  }, 620);

  initAudio();
}

function printWorksheet(lessonId) {
  var sheet = el("worksheet");

  if (!sheet) {
    sheet = document.createElement("div");
    sheet.id = "worksheet";
    document.body.appendChild(sheet);
  }

  var chosen = [];
  var i;

  if (lessonId) {
    chosen.push(findLesson(lessonId));
  } else {
    for (i = 0; i < LESSONS.length; i++) {
      chosen.push(LESSONS[i]);
    }
  }

  var html =
    '<h1>🍎 Yummy Math — Grade 1 Practice Worksheet</h1>' +
    '<p class="ws-line">Name: ______________________________     Date: __________________</p>' +
    '<p class="ws-note">Write the letter of the correct answer inside the box. ' +
    'Ask a grown-up to check your work when you are finished!</p>';

  var number = 1;

  for (i = 0; i < chosen.length; i++) {
    var lesson = chosen[i];
    if (!lesson) {
      continue;
    }

    var list = questionsOf(lesson);
    var j;

    html += '<h2 class="ws-lesson">' + lesson.icon + " " + esc(lesson.title) + '</h2>';

    for (j = 0; j < list.length; j++) {
      var question = list[j];
      var letters = ["A", "B", "C", "D"];
      var choiceText = [];
      var k;

      for (k = 0; k < question.choices.length; k++) {
        choiceText.push(letters[k] + ". " + esc(question.choices[k]));
      }

      html +=
        '<div class="ws-question">' +
          '<div class="ws-number">' + number + '.</div>' +
          '<div class="ws-body">' +
            (question.visual ? '<div class="ws-visual">' + esc(question.visual) + '</div>' : "") +
            '<div class="ws-text">' + esc(question.text) + '</div>' +
            '<div class="ws-choices">' + choiceText.join("&nbsp;&nbsp;&nbsp;&nbsp;") + '</div>' +
          '</div>' +
          '<div class="ws-box"></div>' +
        '</div>';

      number++;
    }
  }

  html += '<p class="ws-note">Great job, little chef! 🧑‍🍳 Remember: practice a little every day.</p>';

  sheet.innerHTML = html;
  sfxClick();

  try {
    window.print();
  } catch (error) {

  }
}

function onKeyDown(event) {
  var key = event.key;

  if (key === "Escape") {
    closeModal();
    return;
  }

  if (currentScreen !== "quiz" || !game) {
    return;
  }

  if (!game.answered && (key === "1" || key === "2" || key === "3")) {
    var index = Number(key) - 1;
    if (index < game.list[game.index].choices.length) {
      chooseAnswer(index);
    }
    return;
  }

  if (game.answered && (key === "Enter" || key === " ")) {
    event.preventDefault();
    goNext();
  }
}
